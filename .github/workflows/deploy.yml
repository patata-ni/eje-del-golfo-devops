name: Eje del Golfo - Integrar, construir y entregar
on:
  push:
    branches: [main, develop, 'feature/**', 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eje-${{ github.ref }}
  cancel-in-progress: false
env:
  PHP_VERSION: '8.3'
  E2E_ADMIN_EMAIL: admin.ci@ejegolfo.example
  E2E_ADMIN_PASSWORD: ci-only-EG-Password-2026
  E2E_MECHANIC_EMAIL: mechanic.ci@ejegolfo.example
  E2E_MECHANIC_PASSWORD: ci-only-EG-Password-2026
  E2E_CLIENT_EMAIL: client.ci@ejegolfo.example
  E2E_CLIENT_PASSWORD: ci-only-EG-Password-2026

jobs:
  validate:
    name: Validar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      DEMO_ACCOUNTS: 'true'
      DEMO_ADMIN_EMAIL: admin.ci@ejegolfo.example
      DEMO_ADMIN_PASSWORD: ci-only-EG-Password-2026
      DEMO_MECHANIC_EMAIL: mechanic.ci@ejegolfo.example
      DEMO_MECHANIC_PASSWORD: ci-only-EG-Password-2026
      DEMO_CLIENT_EMAIL: client.ci@ejegolfo.example
      DEMO_CLIENT_PASSWORD: ci-only-EG-Password-2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, zip, intl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - name: Preparar entorno de CI desechable
        shell: bash
        run: |
          cp .env.example .env
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs artifacts
          touch database/database.sqlite
          php artisan key:generate --force
      - run: npm run build
      - name: Pruebas funcionales de Laravel
        env:
          DEMO_ACCOUNTS: 'false'
        run: php artisan test --compact --log-junit artifacts/phpunit.xml
      - run: php artisan migrate --force
      - run: php artisan db:seed --force
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - if: runner.os == 'Linux'
        run: npm run test:e2e
      - if: runner.os == 'Windows'
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validacion-${{ matrix.os }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 30

  build:
    name: Construir y comprobar artefacto MySQL
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-only-2026
          MYSQL_DATABASE: ejegolfo_ci
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-mysql-only-2026" --health-interval=10s --health-timeout=5s --health-retries=15
    outputs:
      image: ${{ steps.publish.outputs.image }}
      source_hash: ${{ steps.publish.outputs.source_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Construir imagen de aplicación y frontend
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t eje-validado:ci .
      - name: Probar el artefacto con MySQL real
        env:
          BASE_URL: http://127.0.0.1:8085
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          docker run -d --name eje-ci --network host \
            -e PORT=8085 -e APP_URL=http://127.0.0.1:8085 -e APP_DEBUG=false \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e SESSION_SECURE_COOKIE=false \
            -e DB_CONNECTION=mysql -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_DATABASE=ejegolfo_ci -e DB_USERNAME=root -e DB_PASSWORD=ci-mysql-only-2026 \
            -e DEMO_ACCOUNTS=true \
            -e DEMO_ADMIN_EMAIL="$E2E_ADMIN_EMAIL" -e DEMO_ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" \
            -e DEMO_MECHANIC_EMAIL="$E2E_MECHANIC_EMAIL" -e DEMO_MECHANIC_PASSWORD="$E2E_MECHANIC_PASSWORD" \
            -e DEMO_CLIENT_EMAIL="$E2E_CLIENT_EMAIL" -e DEMO_CLIENT_PASSWORD="$E2E_CLIENT_PASSWORD" \
            eje-validado:ci
          node scripts/wait-deployment.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:8085
          EXPECTED_COMMIT: ${{ github.sha }}
      - name: Publicar imagen validada por digest
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eje-del-golfo:$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag eje-validado:ci "$image"
          docker push "$image"
          ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          echo "source_hash=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/deployed-version.json')).source_hash")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$ref" > artifacts/image-digest.txt
      - name: Conservar registro del contenedor
        if: always()
        run: |
          mkdir -p artifacts
          docker logs eje-ci > artifacts/container.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: artefacto-validado-${{ github.sha }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 30

  deploy-testing:
    name: Entregar y validar pruebas en Railway
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: pruebas
      url: https://eje-web-pruebas.up.railway.app
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      BASE_URL: https://eje-web-pruebas.up.railway.app
      EXPECTED_COMMIT: ${{ github.sha }}
      EXPECTED_SOURCE_HASH: ${{ needs.build.outputs.source_hash }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MECHANIC_EMAIL: ${{ secrets.E2E_MECHANIC_EMAIL }}
      E2E_MECHANIC_PASSWORD: ${{ secrets.E2E_MECHANIC_PASSWORD }}
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --global @railway/cli@5.75.0
      - name: Desplegar digest validado
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: railway environment edit --project 4236ca6a-af30-4e1c-bbe5-34eadb68f375 --environment 4af223b3-3dc6-47e9-8142-b747b0a0b6b4 --service-config c4d557eb-636d-4c59-936b-2f7f0072b0e2 source.image "$IMAGE_REF" --service-config c4d557eb-636d-4c59-936b-2f7f0072b0e2 deploy.healthcheckPath /version --message "Entrega validada desde GitHub Actions"
      - run: node scripts/wait-deployment.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencia-pruebas
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 30

  deploy-preproduction:
    name: Promover mismo artefacto y validar preproducción
    needs: [build, deploy-testing]
    runs-on: ubuntu-latest
    environment:
      name: preproduccion
      url: https://eje-web-preproduccion.up.railway.app
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      BASE_URL: https://eje-web-preproduccion.up.railway.app
      EXPECTED_COMMIT: ${{ github.sha }}
      EXPECTED_SOURCE_HASH: ${{ needs.build.outputs.source_hash }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MECHANIC_EMAIL: ${{ secrets.E2E_MECHANIC_EMAIL }}
      E2E_MECHANIC_PASSWORD: ${{ secrets.E2E_MECHANIC_PASSWORD }}
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --global @railway/cli@5.75.0
      - name: Promover el mismo digest sin reconstruir
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: railway environment edit --project 4236ca6a-af30-4e1c-bbe5-34eadb68f375 --environment c0f831f3-e576-4dcb-a9e0-ffa72f0645b7 --service-config c4d557eb-636d-4c59-936b-2f7f0072b0e2 source.image "$IMAGE_REF" --service-config c4d557eb-636d-4c59-936b-2f7f0072b0e2 deploy.healthcheckPath /version --message "Promoción del artefacto probado"
      - run: node scripts/wait-deployment.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Registrar candidata de liberación
        run: |
          echo "## Eje del Golfo: versión validada en preproducción" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Pruebas: https://eje-web-pruebas.up.railway.app" >> "$GITHUB_STEP_SUMMARY"
          echo "Preproducción: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Producción no se ha liberado." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencia-preproduccion
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 30
